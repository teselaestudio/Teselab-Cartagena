<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TESELAB | Cartografía Cartagena</title>
  <link rel="icon" type="image/png" href="recursos/favicon tesela.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fondo Color Sólido #121212 -->
  <div class="background-stage" aria-hidden="true"></div>

  <!-- Ventana Flotante de Vidrio Esmerilado Centrada -->
  <main class="glass-window glass-window-wide">
    <header class="window-header">
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 0.85rem; width: 100%;">
        <a
          href="https://www.teselaestudio.es"
          target="_blank"
          rel="noopener noreferrer"
          class="web-link-icon"
          title="Visitar web oficial de Tesela Estudio (www.teselaestudio.es)"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </a>
        <div class="user-pill">
          <span class="user-status-dot"></span>
          <span id="userEmail">Autenticando...</span>
        </div>
        <button id="logoutBtn" class="btn-secondary-glass" title="Cerrar sesión">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Salir</span>
        </button>
      </div>
    </header>

    <div class="landing-body">
      <!-- Logotipo de Tesela Estudio GRANDE -->
      <div class="brand-logo-container">
        <a href="https://www.teselaestudio.es" target="_blank" rel="noopener noreferrer">
          <img
            src="recursos/logo blanco.png"
            alt="Tesela Estudio"
            class="brand-logo"
            style="max-height: 48px;"
          />
        </a>
      </div>

      <!-- Etiqueta amarilla PÁGINA EN PRUEBAS -->
      <div class="wip-tag">PÁGINA EN PRUEBAS</div>

      <!-- Título principal en Montserrat -->
      <h1 class="landing-title">TESELAB CARTAGENA</h1>

      <!-- Mensaje descriptivo actualizado -->
      <p class="landing-subtitle">
        Teselab es tu herramienta de consulta y filtrado cartográfico interactivo.
      </p>

      <!-- Botón único CONSULTAR CARTOGRAFÍA -->
      <div class="landing-actions">
        <button id="btnConsultar" class="btn-glass-primary btn-consultar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          <span>CONSULTAR CARTOGRAFÍA</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth, logout } from "./auth.js";

    const userEmailSpan = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const btnConsultar = document.getElementById("btnConsultar");

    async function init() {
      const session = await requireAuth();
      if (session && session.user) {
        userEmailSpan.textContent = session.user.email || "Usuario autenticado";
      }
    }

    logoutBtn.addEventListener("click", async () => {
      await logout();
    });

    btnConsultar.addEventListener("click", () => {
      window.location.href = "visor.html";
    });

    init();
  </script>
</body>
</html>
