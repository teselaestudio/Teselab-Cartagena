<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TESELAB | Acceso</title>
  <link rel="icon" type="image/png" href="recursos/favicon tesela.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Fondo Color Sólido #121212 -->
  <div class="background-stage" aria-hidden="true"></div>

  <!-- Tarjeta de Vidrio Esmerilado Centrada -->
  <main class="glass-window">
    <!-- Barra superior minimalista (sin dirección web) -->
    <header class="window-header">
      <!-- Icono web que redirecciona a www.teselaestudio.es -->
      <a
        href="https://www.teselaestudio.es"
        target="_blank"
        rel="noopener noreferrer"
        class="web-link-icon"
        title="Visitar web oficial de Tesela Estudio (www.teselaestudio.es)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </a>
    </header>

    <!-- Contenido Centrado -->
    <div class="window-body-centered">
      <!-- Logotipo de Tesela Estudio GRANDE -->
      <div class="brand-logo-container">
        <a href="https://www.teselaestudio.es" target="_blank" rel="noopener noreferrer">
          <img
            src="recursos/logo blanco.png"
            alt="Tesela Estudio"
            class="brand-logo"
          />
        </a>
      </div>

      <!-- Título TESELAB con tipografía Montserrat -->
      <h1 class="auth-title">TESELAB</h1>
      <p class="auth-subtitle">Acceso restringido a la plataforma territorial</p>

      <!-- Caja de Alerta / Error -->
      <div id="alertBox" class="alert"></div>

      <!-- Formulario de Acceso -->
      <form id="loginForm" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="usuario@ejemplo.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="btn-glass-primary">
          <span id="btnText">Iniciar Sesión</span>
          <div id="btnSpinner" class="spinner" style="display: none;"></div>
        </button>
      </form>

      <div class="auth-footer">
        <p>¿Sin credenciales? <a href="https://www.teselaestudio.es" target="_blank" rel="noopener noreferrer">Contacta con Tesela Estudio</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    import { login, redirectIfAuthenticated, isConfigured } from "./auth.js";

    const alertBox = document.getElementById("alertBox");
    const loginForm = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");

    function showAlert(message, type = "error") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
    }

    function clearAlert() {
      alertBox.style.display = "none";
      alertBox.textContent = "";
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.style.display = isLoading ? "inline-block" : "none";
      btnText.textContent = isLoading ? "Verificando..." : "Iniciar Sesión";
    }

    if (!isConfigured()) {
      showAlert(
        "Aviso: Falta configurar 'config.js' con las credenciales de tu proyecto Supabase.",
        "warning"
      );
    } else {
      redirectIfAuthenticated();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        setLoading(true);
        await login(email, password);
        window.location.href = "landing.html";
      } catch (err) {
        setLoading(false);
        if (err.message && err.message.includes("Invalid login credentials")) {
          showAlert("Correo electrónico o contraseña incorrectos.");
        } else if (err.message && err.message.includes("Email not confirmed")) {
          showAlert("Por favor, confirma tu correo electrónico antes de iniciar sesión.");
        } else {
          showAlert(err.message || "Error al iniciar sesión. Inténtalo de nuevo.");
        }
      }
    });
  </script>
</body>
</html>
