<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso | Visor Cartagena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-badge">Acceso Seguro</div>
        <h1 class="brand-title">Visor Cartagena</h1>
        <p class="brand-subtitle">Introduce tus credenciales para acceder a la plataforma</p>
      </div>

      <!-- Alerta de aviso o error -->
      <div id="alertBox" class="alert"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="usuario@ejemplo.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span id="btnText">Iniciar Sesión</span>
          <div id="btnSpinner" class="spinner" style="display: none;"></div>
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No dispones de acceso? Solicita el alta al administrador del proyecto.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, redirectIfAuthenticated, isConfigured } from "./auth.js";

    const alertBox = document.getElementById("alertBox");
    const loginForm = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");

    function showAlert(message, type = "error") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
    }

    function clearAlert() {
      alertBox.style.display = "none";
      alertBox.textContent = "";
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.style.display = isLoading ? "inline-block" : "none";
      btnText.textContent = isLoading ? "Verificando..." : "Iniciar Sesión";
    }

    // Comprobar si ya está configurado Supabase
    if (!isConfigured()) {
      showAlert(
        "Aviso: Falta configurar 'config.js' con las credenciales de tu proyecto Supabase.",
        "warning"
      );
    } else {
      // Si ya hay sesión activa previa, redirigir a landing.html
      redirectIfAuthenticated();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        setLoading(true);
        await login(email, password);
        // Login exitoso -> redirigir a landing page
        window.location.href = "landing.html";
      } catch (err) {
        setLoading(false);
        // Mensajes de error en español amigables
        if (err.message.includes("Invalid login credentials")) {
          showAlert("Correo electrónico o contraseña incorrectos.");
        } else if (err.message.includes("Email not confirmed")) {
          showAlert("Por favor, confirma tu correo electrónico antes de iniciar sesión.");
        } else {
          showAlert(err.message || "Error al iniciar sesión. Inténtalo de nuevo.");
        }
      }
    });
  </script>
</body>
</html>
